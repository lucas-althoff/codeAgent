[project]
name = "codeagent"
version = "0.1.0"
description = "Code Agent - Provides code optimization suggestions based on Python best practices"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crewai>=1.2.1",
    "crewai-tools>=0.18.1",
    "fastapi>=0.120.1",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.30.0",
    "streamlit>=1.39.0",
    "httpx>=0.27.0",
]

[project.scripts]
start = "uvicorn src.app:app --host 0.0.0.0 --port 8000"
dev = "uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload"
ui = "streamlit run src/ui/app.py"